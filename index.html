<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Are You Cute? 🥹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- animated cursor follower -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- floating bubbles -->
  <div class="bubbles" id="bubbles"></div>

  <!-- floating emojis -->
  <div class="emoji-field" id="emojiField"></div>

  <!-- confetti canvas -->
  <canvas id="confettiCanvas"></canvas>

  <main class="stage">
    <section class="card" id="card">
      <h1 class="question" id="question">Are you Cute? 🥹</h1>
      <p class="subtext" id="subtext">tap a button, be honest (or don't)</p>

      <div class="btn-row" id="btnRow">
        <button class="btn btn-no" id="noBtn">NO 😂</button>
        <button class="btn btn-yes" id="yesBtn">YES 😌</button>
      </div>

      <p class="hint" id="hint">psst... try clicking "YES" 👀</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
