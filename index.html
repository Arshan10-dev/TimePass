<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Garden</title>
  <style>
    /* ─────────────────────────────────────────────
       ROOT TOKENS
    ───────────────────────────────────────────── */
    :root {
      --navy:   #060818;
      --deep:   #0b0d2a;
      --violet: #1a0a2e;
      --plum:   #2d0f45;
      --rose:   #e8a0b0;
      --blush:  #f5c6d8;
      --gold:   #f0d080;
      --glow:   rgba(220,140,180,0.18);
      --fog:    rgba(180,140,220,0.07);
    }

    /* ─────────────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Georgia', serif;
      background: var(--navy);
    }

    /* ─────────────────────────────────────────────
       SCENE LAYERS (back → front)
       1. Sky gradient
       2. Stars canvas
       3. Particle canvas
       4. Falling petals canvas
       5. Bouquet SVG
       6. Vignette overlay
       7. Title text
    ───────────────────────────────────────────── */

    /* --- Sky --- */
    #sky {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, #1a083a 0%, #0b0d2a 45%, #06060f 100%),
                  radial-gradient(ellipse at 70% 80%, #2d0f45 0%, transparent 60%);
      background-blend-mode: screen;
      z-index: 0;
    }

    /* --- Canvases --- */
    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #starCanvas   { z-index: 1; }
    #glowCanvas   { z-index: 2; }
    #petalCanvas  { z-index: 3; }

    /* --- Bouquet stage --- */
    #bouquetStage {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(640px, 92vw);
      height: min(700px, 85vh);
      z-index: 5;
      transform-origin: bottom center;
    }

    /* --- Vignette --- */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 6;
      background:
        radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(4,4,14,0.65) 100%),
        linear-gradient(to top, rgba(4,4,14,0.85) 0%, transparent 30%);
      pointer-events: none;
    }

    /* --- Title --- */
    #title {
      position: fixed;
      top: 7vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 7;
      text-align: center;
      opacity: 0;
      animation: fadeTitle 2.5s ease 3.8s forwards;
      white-space: nowrap;
    }
    #title h1 {
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--blush);
      text-shadow:
        0 0 18px rgba(240,190,210,0.6),
        0 0 48px rgba(200,120,170,0.35),
        0 0 90px rgba(160,80,140,0.2);
    }
    #title p {
      margin-top: 0.5em;
      font-size: clamp(0.8rem, 1.8vw, 1.1rem);
      letter-spacing: 0.4em;
      color: rgba(240,200,220,0.45);
      font-style: italic;
    }

    @keyframes fadeTitle {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ─────────────────────────────────────────────
       BOUQUET SVG FLOWER ANIMATIONS
    ───────────────────────────────────────────── */

    /* Each flower group gets a stagger */
    .flower { transform-origin: bottom center; }

    .flower-0 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 0.3s both,
                            sway0 6s ease-in-out 1.5s infinite; }
    .flower-1 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 0.7s both,
                            sway1 7s ease-in-out 2.0s infinite; }
    .flower-2 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 1.0s both,
                            sway2 5.5s ease-in-out 2.3s infinite; }
    .flower-3 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 1.3s both,
                            sway0 8s ease-in-out 2.1s infinite; }
    .flower-4 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 1.6s both,
                            sway1 6.5s ease-in-out 1.8s infinite; }
    .flower-5 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 1.9s both,
                            sway2 7.5s ease-in-out 2.5s infinite; }
    .flower-6 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 2.2s both,
                            sway0 5.8s ease-in-out 2.8s infinite; }
    .flower-7 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 2.5s both,
                            sway1 6.2s ease-in-out 3.0s infinite; }
    .flower-8 { animation: flowerPop 1.1s cubic-bezier(.22,1.8,.4,1) 2.8s both,
                            sway2 7.0s ease-in-out 3.2s infinite; }

    /* Foliage / wrap leaves */
    .leaf   { animation: flowerPop 1.2s cubic-bezier(.22,1.6,.4,1) 3.1s both; }
    .ribbon { animation: flowerPop 0.9s cubic-bezier(.22,1.4,.4,1) 3.4s both; }

    @keyframes flowerPop {
      0%   { transform: scale(0) translateY(40px); opacity: 0; }
      70%  { opacity: 1; }
      100% { transform: scale(1) translateY(0);   opacity: 1; }
    }

    /* Three distinct sway personalities */
    @keyframes sway0 {
      0%, 100% { transform: rotate(-4deg) translateY(0);    }
      25%       { transform: rotate(3deg)  translateY(-4px); }
      50%       { transform: rotate(-2deg) translateY(-2px); }
      75%       { transform: rotate(5deg)  translateY(-5px); }
    }
    @keyframes sway1 {
      0%, 100% { transform: rotate(3deg)  translateY(-2px); }
      30%       { transform: rotate(-5deg) translateY(-6px); }
      60%       { transform: rotate(4deg)  translateY(-1px); }
    }
    @keyframes sway2 {
      0%, 100% { transform: rotate(-2deg) translateY(-1px); }
      40%       { transform: rotate(6deg)  translateY(-7px); }
      70%       { transform: rotate(-4deg) translateY(-3px); }
    }
  </style>
</head>
<body>

<!-- ── LAYER 1: SKY ─────────────────────────── -->
<div id="sky"></div>

<!-- ── LAYER 2: STARS ──────────────────────── -->
<canvas id="starCanvas"></canvas>

<!-- ── LAYER 3: GLOW PARTICLES ────────────── -->
<canvas id="glowCanvas"></canvas>

<!-- ── LAYER 4: FALLING PETALS ────────────── -->
<canvas id="petalCanvas"></canvas>

<!-- ── LAYER 5: BOUQUET ───────────────────── -->
<div id="bouquetStage">
  <!--
    The bouquet is a hand-crafted inline SVG.
    Flowers are:
      • 3 full roses (centre, left, right)
      • 2 peonies
      • 2 anemones
      • 2 small daisies
      • multiple foliage leaves
      • a silk ribbon tie
    Each <g class="flower flower-N"> can be individually animated.
  -->
  <svg id="bouquetSVG"
       viewBox="0 0 640 700"
       xmlns="http://www.w3.org/2000/svg"
       width="100%" height="100%"
       style="overflow:visible; filter: drop-shadow(0 20px 60px rgba(200,100,160,0.35)) drop-shadow(0 4px 20px rgba(120,60,100,0.5));">

    <defs>
      <!-- Stem gradient -->
      <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#1a3a14"/>
        <stop offset="50%"  stop-color="#2e6020"/>
        <stop offset="100%" stop-color="#1a3a14"/>
      </linearGradient>

      <!-- Leaf gradient -->
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#3a7a28"/>
        <stop offset="100%" stop-color="#1a4012"/>
      </linearGradient>
      <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#4a8a30"/>
        <stop offset="100%" stop-color="#225018"/>
      </linearGradient>

      <!-- Rose petal gradients -->
      <radialGradient id="rose1" cx="50%" cy="40%" r="55%">
        <stop offset="0%"   stop-color="#f8b4c8"/>
        <stop offset="50%"  stop-color="#e8608a"/>
        <stop offset="100%" stop-color="#c0305a"/>
      </radialGradient>
      <radialGradient id="rose2" cx="50%" cy="40%" r="55%">
        <stop offset="0%"   stop-color="#fcd0e0"/>
        <stop offset="50%"  stop-color="#f490b4"/>
        <stop offset="100%" stop-color="#d85080"/>
      </radialGradient>
      <radialGradient id="rose3" cx="50%" cy="40%" r="55%">
        <stop offset="0%"   stop-color="#ffcce0"/>
        <stop offset="50%"  stop-color="#ff80a8"/>
        <stop offset="100%" stop-color="#e04070"/>
      </radialGradient>

      <!-- Peony gradient -->
      <radialGradient id="peony1" cx="50%" cy="45%" r="58%">
        <stop offset="0%"   stop-color="#fff0f5"/>
        <stop offset="40%"  stop-color="#fdc0d8"/>
        <stop offset="100%" stop-color="#e06090"/>
      </radialGradient>

      <!-- Anemone gradient -->
      <radialGradient id="anem1" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#2a1545"/>
        <stop offset="40%"  stop-color="#5a2585"/>
        <stop offset="100%" stop-color="#8840c0"/>
      </radialGradient>
      <radialGradient id="anem2" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffffff"/>
        <stop offset="60%"  stop-color="#f0e0ff"/>
        <stop offset="100%" stop-color="#c8a0e8"/>
      </radialGradient>

      <!-- Daisy gradient -->
      <radialGradient id="daisy1" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fff8e0"/>
        <stop offset="100%" stop-color="#f0d060"/>
      </radialGradient>

      <!-- Ribbon gradient -->
      <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#c060a0"/>
        <stop offset="50%"  stop-color="#e890c0"/>
        <stop offset="100%" stop-color="#a04080"/>
      </linearGradient>

      <!-- Glow filter for flowers -->
      <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softBloom" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ═══════════════ STEMS ═══════════════ -->
    <!-- Center rose stem -->
    <path d="M320 700 C318 620 315 560 316 490" stroke="url(#stemGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Left rose stem -->
    <path d="M320 700 C308 640 285 590 268 520" stroke="url(#stemGrad)" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <!-- Far left flower stem -->
    <path d="M320 700 C298 645 265 600 240 540" stroke="url(#stemGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Right rose stem -->
    <path d="M320 700 C332 640 355 590 372 520" stroke="url(#stemGrad)" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <!-- Far right flower stem -->
    <path d="M320 700 C342 645 375 600 400 540" stroke="url(#stemGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Back left peony stem -->
    <path d="M320 700 C302 630 272 560 258 480" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Back right peony stem -->
    <path d="M320 700 C338 630 368 560 382 480" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Anemone left stem -->
    <path d="M320 700 C295 620 250 555 228 465" stroke="url(#stemGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Anemone right stem -->
    <path d="M320 700 C345 620 390 555 412 465" stroke="url(#stemGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- ═══════════════ LEAVES ═══════════════ -->
    <g class="leaf">
      <!-- Left leaf cluster -->
      <ellipse cx="276" cy="590" rx="28" ry="12" fill="url(#leafGrad)" transform="rotate(-40 276 590)" opacity="0.9"/>
      <ellipse cx="260" cy="570" rx="22" ry="9" fill="url(#leafGrad2)" transform="rotate(-55 260 570)" opacity="0.8"/>
      <!-- Right leaf cluster -->
      <ellipse cx="364" cy="590" rx="28" ry="12" fill="url(#leafGrad)" transform="rotate(40 364 590)" opacity="0.9"/>
      <ellipse cx="380" cy="570" rx="22" ry="9" fill="url(#leafGrad2)" transform="rotate(55 380 570)" opacity="0.8"/>
      <!-- Center leaf -->
      <ellipse cx="310" cy="550" rx="18" ry="8" fill="url(#leafGrad)" transform="rotate(-20 310 550)" opacity="0.85"/>
      <ellipse cx="330" cy="545" rx="18" ry="8" fill="url(#leafGrad2)" transform="rotate(15 330 545)" opacity="0.8"/>
      <!-- Lower leaves -->
      <ellipse cx="290" cy="630" rx="24" ry="10" fill="url(#leafGrad)" transform="rotate(-50 290 630)" opacity="0.75"/>
      <ellipse cx="350" cy="625" rx="24" ry="10" fill="url(#leafGrad)" transform="rotate(50 350 625)" opacity="0.75"/>
    </g>

    <!-- ═══════════════ RIBBON ═══════════════ -->
    <g class="ribbon">
      <!-- Ribbon knot/bow -->
      <path d="M298 665 C278 648 262 670 272 682 C280 692 298 680 298 665Z" fill="url(#ribbonGrad)" opacity="0.95"/>
      <path d="M342 665 C362 648 378 670 368 682 C360 692 342 680 342 665Z" fill="url(#ribbonGrad)" opacity="0.95"/>
      <!-- Center knot -->
      <ellipse cx="320" cy="668" rx="14" ry="10" fill="#d06090"/>
      <!-- Trailing ribbon -->
      <path d="M306 672 C298 690 285 710 272 720" stroke="#d06090" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M334 672 C342 690 355 710 368 720" stroke="#d06090" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- Stem wrap -->
      <rect x="308" y="645" width="24" height="55" rx="8" fill="url(#ribbonGrad)" opacity="0.55"/>
    </g>

    <!-- ══════════════════════════════════════
         FLOWER DEFINITIONS (reusable paths)
    ══════════════════════════════════════════ -->

    <!--
      ROSE HELPER — we draw each rose inline using
      layered petal paths for depth.
    -->

    <!-- ── FLOWER 0: CENTER ROSE (large, deep pink) ── -->
    <g class="flower flower-0" transform="translate(316,486)" filter="url(#bloom)">
      <!-- Outer petals -->
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(0)"   opacity="0.95"/>
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(45)"  opacity="0.90"/>
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(90)"  opacity="0.90"/>
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(135)" opacity="0.90"/>
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(180)" opacity="0.90"/>
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(225)" opacity="0.90"/>
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(270)" opacity="0.90"/>
      <ellipse cx="0"  cy="-34" rx="20" ry="36" fill="url(#rose1)" transform="rotate(315)" opacity="0.90"/>
      <!-- Mid petals -->
      <ellipse cx="0"  cy="-22" rx="15" ry="26" fill="#e8608a" transform="rotate(22.5)"  opacity="0.95"/>
      <ellipse cx="0"  cy="-22" rx="15" ry="26" fill="#e8608a" transform="rotate(67.5)"  opacity="0.95"/>
      <ellipse cx="0"  cy="-22" rx="15" ry="26" fill="#e8608a" transform="rotate(112.5)" opacity="0.95"/>
      <ellipse cx="0"  cy="-22" rx="15" ry="26" fill="#e8608a" transform="rotate(157.5)" opacity="0.95"/>
      <ellipse cx="0"  cy="-22" rx="15" ry="26" fill="#e8608a" transform="rotate(202.5)" opacity="0.95"/>
      <ellipse cx="0"  cy="-22" rx="15" ry="26" fill="#e8608a" transform="rotate(247.5)" opacity="0.95"/>
      <!-- Inner cup -->
      <ellipse cx="0"  cy="-10" rx="10" ry="16" fill="#f8b4c8" transform="rotate(30)"   opacity="1"/>
      <ellipse cx="0"  cy="-10" rx="10" ry="16" fill="#f8b4c8" transform="rotate(90)"   opacity="1"/>
      <ellipse cx="0"  cy="-10" rx="10" ry="16" fill="#f8b4c8" transform="rotate(150)"  opacity="1"/>
      <ellipse cx="0"  cy="-10" rx="10" ry="16" fill="#f8b4c8" transform="rotate(210)"  opacity="1"/>
      <!-- Centre -->
      <circle cx="0" cy="0" r="9" fill="#c0305a"/>
      <circle cx="0" cy="0" r="5" fill="#e07090"/>
      <!-- Sepal -->
      <ellipse cx="0" cy="12" rx="18" ry="8" fill="#2e6020" opacity="0.6"/>
    </g>

    <!-- ── FLOWER 1: LEFT ROSE (medium, blush) ── -->
    <g class="flower flower-1" transform="translate(268,516)" filter="url(#softBloom)">
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose2)" transform="rotate(0)"   opacity="0.92"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose2)" transform="rotate(51)"  opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose2)" transform="rotate(102)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose2)" transform="rotate(153)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose2)" transform="rotate(204)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose2)" transform="rotate(255)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose2)" transform="rotate(306)" opacity="0.88"/>
      <!-- Mid -->
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#f490b4" transform="rotate(25)"  opacity="0.95"/>
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#f490b4" transform="rotate(85)"  opacity="0.95"/>
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#f490b4" transform="rotate(145)" opacity="0.95"/>
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#f490b4" transform="rotate(205)" opacity="0.95"/>
      <!-- Centre -->
      <circle cx="0" cy="0" r="7" fill="#d85080"/>
      <ellipse cx="0" cy="10" rx="14" ry="6" fill="#2e6020" opacity="0.5"/>
    </g>

    <!-- ── FLOWER 2: RIGHT ROSE (medium, coral-pink) ── -->
    <g class="flower flower-2" transform="translate(372,516)" filter="url(#softBloom)">
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose3)" transform="rotate(0)"   opacity="0.92"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose3)" transform="rotate(51)"  opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose3)" transform="rotate(102)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose3)" transform="rotate(153)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose3)" transform="rotate(204)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose3)" transform="rotate(255)" opacity="0.88"/>
      <ellipse cx="0" cy="-28" rx="17" ry="30" fill="url(#rose3)" transform="rotate(306)" opacity="0.88"/>
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#ff80a8" transform="rotate(25)"  opacity="0.95"/>
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#ff80a8" transform="rotate(85)"  opacity="0.95"/>
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#ff80a8" transform="rotate(145)" opacity="0.95"/>
      <ellipse cx="0" cy="-16" rx="12" ry="20" fill="#ff80a8" transform="rotate(205)" opacity="0.95"/>
      <circle cx="0" cy="0" r="7" fill="#e04070"/>
      <ellipse cx="0" cy="10" rx="14" ry="6" fill="#2e6020" opacity="0.5"/>
    </g>

    <!-- ── FLOWER 3: LEFT BACK PEONY ── -->
    <g class="flower flower-3" transform="translate(258,472)" filter="url(#softBloom)">
      <!-- Outer guard petals (broad, ruffled) -->
      <ellipse cx="0" cy="-32" rx="22" ry="18" fill="url(#peony1)" transform="rotate(0)"   opacity="0.88"/>
      <ellipse cx="0" cy="-32" rx="22" ry="18" fill="url(#peony1)" transform="rotate(60)"  opacity="0.88"/>
      <ellipse cx="0" cy="-32" rx="22" ry="18" fill="url(#peony1)" transform="rotate(120)" opacity="0.88"/>
      <ellipse cx="0" cy="-32" rx="22" ry="18" fill="url(#peony1)" transform="rotate(180)" opacity="0.88"/>
      <ellipse cx="0" cy="-32" rx="22" ry="18" fill="url(#peony1)" transform="rotate(240)" opacity="0.88"/>
      <ellipse cx="0" cy="-32" rx="22" ry="18" fill="url(#peony1)" transform="rotate(300)" opacity="0.88"/>
      <!-- Inner dense petals -->
      <ellipse cx="0" cy="-18" rx="15" ry="13" fill="#fdc0d8" transform="rotate(30)"  opacity="0.95"/>
      <ellipse cx="0" cy="-18" rx="15" ry="13" fill="#fdc0d8" transform="rotate(90)"  opacity="0.95"/>
      <ellipse cx="0" cy="-18" rx="15" ry="13" fill="#fdc0d8" transform="rotate(150)" opacity="0.95"/>
      <ellipse cx="0" cy="-18" rx="15" ry="13" fill="#fdc0d8" transform="rotate(210)" opacity="0.95"/>
      <ellipse cx="0" cy="-18" rx="15" ry="13" fill="#fdc0d8" transform="rotate(270)" opacity="0.95"/>
      <ellipse cx="0" cy="-18" rx="15" ry="13" fill="#fdc0d8" transform="rotate(330)" opacity="0.95"/>
      <!-- Innermost cluster -->
      <circle cx="0" cy="-6" r="14" fill="#fde8f2"/>
      <circle cx="0" cy="-6" r="8"  fill="#f8d0e8"/>
      <circle cx="0" cy="-6" r="4"  fill="#f0b8d8"/>
    </g>

    <!-- ── FLOWER 4: RIGHT BACK PEONY ── -->
    <g class="flower flower-4" transform="translate(382,472)" filter="url(#softBloom)">

<!-- ══════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════════ -->
<script>
/* ─────────────────────────────────────────────
   UTILITY
───────────────────────────────────────────── */
const rand  = (min, max) => Math.random() * (max - min) + min;
const randI = (min, max) => Math.floor(rand(min, max));
const TAU   = Math.PI * 2;

/* ─────────────────────────────────────────────
   1. STAR FIELD
───────────────────────────────────────────── */
(function initStars() {
  const canvas = document.getElementById('starCanvas');
  const ctx    = canvas.getContext('2d');

  const stars  = [];
  const STAR_COUNT = 220;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    buildStars();
  }

  function buildStars() {
    stars.length = 0;
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x:     rand(0, canvas.width),
        y:     rand(0, canvas.height * 0.75),   // upper 75% of sky
        r:     rand(0.4, 2.2),
        alpha: rand(0.25, 0.9),
        speed: rand(0.002, 0.006),               // twinkle speed
        phase: rand(0, TAU),
        color: Math.random() > 0.85
               ? `hsl(${randI(200,300)},80%,85%)`
               : '#ffffff'
      });
    }
  }

  let t = 0;
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    t += 0.012;
    for (const s of stars) {
      const a = s.alpha * (0.55 + 0.45 * Math.sin(t * s.speed * 60 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = a;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', resize);
  resize();
  drawStars();
})();


/* ─────────────────────────────────────────────
   2. SOFT GLOW PARTICLES (floating light orbs)
───────────────────────────────────────────── */
(function initGlow() {
  const canvas = document.getElementById('glowCanvas');
  const ctx    = canvas.getContext('2d');

  const ORBS   = 28;
  const orbs   = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    buildOrbs();
  }

  function buildOrbs() {
    orbs.length = 0;
    const palette = [
      'rgba(200,120,180,',   // dusty rose
      'rgba(150,100,220,',   // soft violet
      'rgba(240,180,220,',   // blush
      'rgba(100,80,200,',    // indigo
      'rgba(220,160,100,',   // warm gold
    ];
    for (let i = 0; i < ORBS; i++) {
      orbs.push({
        x:      rand(0, canvas.width),
        y:      rand(0, canvas.height),
        r:      rand(60, 220),
        alpha:  rand(0.025, 0.08),
        color:  palette[randI(0, palette.length)],
        vx:     rand(-0.12, 0.12),
        vy:     rand(-0.08, 0.08),
        pulse:  rand(0, TAU),
        pSpeed: rand(0.003, 0.01),
      });
    }
  }

  function drawOrbs() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const o of orbs) {
      o.pulse += o.pSpeed;
      o.x     += o.vx;
      o.y     += o.vy;

      // Soft wraparound
      if (o.x < -o.r)              o.x = canvas.width  + o.r;
      if (o.x > canvas.width + o.r) o.x = -o.r;
      if (o.y < -o.r)              o.y = canvas.height + o.r;
      if (o.y > canvas.height + o.r) o.y = -o.r;

      const a = o.alpha * (0.6 + 0.4 * Math.sin(o.pulse));
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      g.addColorStop(0,   o.color + a + ')');
      g.addColorStop(0.5, o.color + a * 0.4 + ')');
      g.addColorStop(1,   o.color + '0)');

      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
    }
    requestAnimationFrame(drawOrbs);
  }

  window.addEventListener('resize', resize);
  resize();
  drawOrbs();
})();


/* ─────────────────────────────────────────────
   3. FALLING PETALS
───────────────────────────────────────────── */
(function initPetals() {
  const canvas = document.getElementById('petalCanvas');
  const ctx    = canvas.getContext('2d');

  const MAX_PETALS = 65;
  const petals     = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  /* Spawn a new petal at the top */
  function spawnPetal() {
    // Pick a random petal style
    const types  = ['oval','heart','star','small-oval'];
    const colors = [
      '#f8c0d8','#f0a0c0','#ffd0e8','#e890b8',
      '#d060a0','#c8a0f0','#fff0f5','#ffb0c8',
      '#fde8f2','#e0c0ff','#f8e0a0',
    ];
    petals.push({
      x:      rand(-40, canvas.width + 40),
      y:      rand(-60, -10),
      size:   rand(6, 22),
      color:  colors[randI(0, colors.length)],
      type:   types[randI(0, types.length)],
      alpha:  rand(0.35, 0.85),
      rot:    rand(0, TAU),
      rotV:   rand(-0.04, 0.04),   // rotation velocity
      vy:     rand(0.5, 2.2),      // fall speed
      vx:     rand(-0.8, 0.8),     // horizontal drift
      wobble: rand(0, TAU),        // horizontal sin-wave phase
      wobbleA:rand(0.4, 1.6),      // wobble amplitude px
      wobbleF:rand(0.01, 0.03),    // wobble frequency
    });
  }

  /* Draw a single petal */
  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;

    if (p.type === 'oval' || p.type === 'small-oval') {
      // Ellipse petal, slightly teardrop-shaped
      const w = p.size, h = p.size * 1.7;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.5, h * 0.5, 0, 0, TAU);
      ctx.fillStyle = p.color;
      ctx.fill();
      // Subtle vein line
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.45);
      ctx.lineTo(0, h * 0.45);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 0.6;
      ctx.stroke();

    } else if (p.type === 'heart') {
      // Tiny heart shape
      const s = p.size * 0.55;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.4);
      ctx.bezierCurveTo(-s, -s * 0.2, -s * 1.4, s * 0.8, 0, s * 1.6);
      ctx.bezierCurveTo( s * 1.4, s * 0.8,  s, -s * 0.2, 0, s * 0.4);
      ctx.fillStyle = p.color;
      ctx.fill();

    } else if (p.type === 'star') {
      // 5-point star petal cluster
      const outer = p.size * 0.8, inner = p.size * 0.35;
      ctx.beginPath();
      for (let k = 0; k < 5; k++) {
        const a1 = (TAU * k / 5) - Math.PI / 2;
        const a2 = (TAU * (k + 0.5) / 5) - Math.PI / 2;
        if (k === 0) ctx.moveTo(Math.cos(a1)*outer, Math.sin(a1)*outer);
        else         ctx.lineTo(Math.cos(a1)*outer, Math.sin(a1)*outer);
        ctx.lineTo(Math.cos(a2)*inner, Math.sin(a2)*inner);
      }
      ctx.closePath();
      ctx.fillStyle = p.color;
      ctx.fill();
    }

    ctx.restore();
  }

  let spawnTimer = 0;
  const SPAWN_INTERVAL = 14; // frames between spawns

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Spawn check
    spawnTimer++;
    if (spawnTimer >= SPAWN_INTERVAL && petals.length < MAX_PETALS) {
      spawnPetal();
      spawnTimer = 0;
    }

    // Update & draw petals
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];

      p.wobble += p.wobbleF;
      p.x  += p.vx + Math.sin(p.wobble) * p.wobbleA;
      p.y  += p.vy;
      p.rot += p.rotV;

      // Gradually fade at edges
      if (p.y > canvas.height * 0.85) {
        p.alpha -= 0.012;
      }

      drawPetal(p);

      // Remove off-screen
      if (p.y > canvas.height + 30 || p.alpha <= 0) {
        petals.splice(i, 1);
      }
    }

    requestAnimationFrame(loop);
  }

  // Pre-populate a few petals so it's not empty on load
  for (let i = 0; i < 18; i++) {
    spawnPetal();
    petals[petals.length - 1].y = rand(0, canvas.height * 0.8);
  }

  window.addEventListener('resize', resize);
  resize();
  loop();
})();


/* ─────────────────────────────────────────────
   4. BOUQUET PARALLAX — subtle mouse movement
───────────────────────────────────────────── */
(function initParallax() {
  const stage = document.getElementById('bouquetStage');
  let  tx = 0, ty = 0, cx = 0, cy = 0;
  const STRENGTH = 10; // max px shift

  window.addEventListener('mousemove', e => {
    tx = ((e.clientX / window.innerWidth)  - 0.5) * STRENGTH;
    ty = ((e.clientY / window.innerHeight) - 0.5) * STRENGTH * 0.4;
  });

  // Touch support
  window.addEventListener('touchmove', e => {
    if (!e.touches[0]) return;
    tx = ((e.touches[0].clientX / window.innerWidth)  - 0.5) * STRENGTH;
    ty = ((e.touches[0].clientY / window.innerHeight) - 0.5) * STRENGTH * 0.4;
  }, { passive: true });

  function lerp(a, b, t) { return a + (b - a) * t; }

  function tick() {
    cx = lerp(cx, tx, 0.05);
    cy = lerp(cy, ty, 0.05);
    stage.style.transform = `translateX(calc(-50% + ${cx}px)) translateY(${cy}px)`;
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
